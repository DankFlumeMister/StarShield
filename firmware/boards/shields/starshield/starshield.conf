# StarShield shield 配置
#
# ⚠️ 本文件每一项都对应 docs/ 里已核实的决策，不要凭感觉加减。
#    引脚分配见 firmware/README.md；依据见 docs/adr/0008 与 docs/power-architecture.md。
#    ⚠️ 所有 CONFIG 符号均已对照 ZMK 官方 app/Kconfig 与 app/Kconfig.defaults 核实存在。

# ── 键盘标识 ────────────────────────────────────────────────
CONFIG_ZMK_KEYBOARD_NAME="StarShield"

# ── 省电（ADR-0001 / ADR-0005 / ADR-0007 的续航目标）─────────
CONFIG_ZMK_SLEEP=y
# 空闲 30 秒进 idle、15 分钟进深睡（ZMK 默认值，显式写出便于调参）
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── RGB（95 颗 SK6812MINI-E，数据线走 spi3）────────────────
CONFIG_ZMK_RGB_UNDERGLOW=y
# ⚠️⚠️ 这一行【不能删】，删了会链接失败，而不是编译失败：
#     undefined reference to `__device_dts_ord_<N>'
#   原因（已核实，Zephyr v3.5.0 drivers/led_strip/Kconfig.ws2812）：
#     ZMK 的 CONFIG_ZMK_RGB_UNDERGLOW 只 select LED_STRIP（上层 API），
#     而真正的驱动开关是 Zephyr 的 menuconfig WS2812_STRIP ——
#     它既没有 default y，也不依赖 devicetree 里的 compatible，
#     必须手动打开。不开 → Kconfig 的 choice WS2812_STRIP_DRIVER 整块不可见
#     → WS2812_STRIP_SPI=n → ws2812_spi.c 不参与编译
#     → drivers__led_strip 库没有源文件 → 设备结构体从未生成
#     → rgb_underglow.c 引用该 device 时链接期报错。
#   参考：ZMK 官方 corne.conf 亦写作 `CONFIG_WS2812_STRIP=y`。
CONFIG_WS2812_STRIP=y
# RGB 开关联动 external power —— 关灯时物理切断 LED 供电（ADR-0005 的关键）
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
# 上电不点灯：省电，且避免开机瞬间的大电流冲击
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# ⚠️ 亮度上限＝硬件电流预算的固件侧护栏（docs/power-architecture.md §5.2）
#    每颗 12 mA/通道 × 3 通道 = 36 mA（100% 灰阶）
#      100% × 95 颗 ≈ 3.4 A  → 远超 JST-PH 2.0 的 2 A 额定
#       70% × 95 颗 ≈ 2.4 A  → 仍超 JST-PH 额定
#       30% × 95 颗 ≈ 1.0 A  → 落在安全区
#    BRT_MAX 取值范围是 0..100，故设 30。用户仍可下调，但无法超过此上限。
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
# 灯效速度调慢一档，降低刷新频率带来的峰值电流
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1

# ── 外设电源门控（ADR-0005 + docs/power-architecture.md §5.4 的 NMOS 反相级）──
CONFIG_ZMK_EXT_POWER=y

# ── 电池电量上报（nice!nano v2 用 VDDH 测量，无需分压脚）────
CONFIG_ZMK_BATTERY_REPORTING=y

# ── 电源管理：软关机（C3，ADR-0010 的配套）──────────────────
# ⚠️ 本项目【不设物理电池断电开关】（ADR-0010），长时间存放靠软关机切到最低功耗。
#    soft_off 会切断外设电源并进入 System OFF；**唤醒只能靠复位**（ZMK 的行为就是如此）
#    —— 对应到本键盘就是「按一下复位键」或重新插 USB。
#    键位：FN 层位置 16（小键盘 `/` 那颗，见 starshield.keymap）。
CONFIG_ZMK_PM_SOFT_OFF=y
# soft_on（唤醒源）不做：本项目没有独立唤醒键，留默认关闭。

# ── USB：允许 UF2 引导按钮 / 复位进入 bootloader 的软件路径 ──
# 刷固件的主通道仍是 nice!nano 板载 USB-C（G7 侧壁开孔），
# 本项提供「不断开外壳、不按键」的软件入口。
CONFIG_ZMK_USB_BOOT=y

# ── 调试 ──────────────────────────────────────────────────
# ⚠️ P0.06（Pro Micro D1）被 WS2812 数据线占用，因此【不要】启用 UART 串口日志。
#    USB 日志走 USB 外设、不占用该引脚，排障时可临时开启下面这行。
# CONFIG_ZMK_USB_LOGGING=y
